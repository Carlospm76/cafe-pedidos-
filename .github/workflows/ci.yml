name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:          # permite que cd.yml lo reutilice en la Parte 4

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar las pruebas
        run: pytest --junitxml=reportes/pruebas.xml

      - name: Guardar el reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: reportes/
